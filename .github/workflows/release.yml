name: Release
on:
  push:
    tags:
      - 'v*'
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: lomux
            archive: lomux-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lomux.exe
            archive: lomux-windows-x64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: lomux
            archive: lomux-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: lomux
            archive: lomux-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build Mac App Bundle
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          tar czf LoMux.app.tar.gz -C target/release/bundle/osx LoMux.app
      - name: Archive Binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd target/${{ matrix.target }}/release
            7z a ../../../${{ matrix.archive }} ${{ matrix.binary }}
          else
            cd target/${{ matrix.target }}/release
            tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            LoMux.app.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: ls -laR
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
