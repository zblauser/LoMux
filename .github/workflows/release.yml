name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: lomux
            archive: lomux-linux-x64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lomux.exe
            archive: lomux-windows-x64.zip

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: lomux
            archive: lomux-macos-x64.tar.gz
            build_app_bundle: true

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: lomux
            archive: lomux-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS App Bundle
        if: ${{ matrix.build_app_bundle == true }}
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          tar czf LoMux.app.tar.gz -C target/release/bundle/osx LoMux.app

      - name: Archive binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../${{ matrix.archive }} ${{ matrix.binary }}
          else
            tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload macOS .app bundle
        if: ${{ matrix.build_app_bundle == true }}
        uses: actions/upload-artifact@v4
        with:
          name: LoMux.app
          path: LoMux.app.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: ls -laR

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
