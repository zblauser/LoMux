[package]
name = "lomux"
version = "1.1.0"
edition = "2021"
authors = ["zblauser"]
description = "Advanced media converter with FFmpeg, yt-dlp integration, and Adobe-style presets"
repository = "https://github.com/zblauser/LoMux"
license = "MIT"
keywords = ["media", "converter", "ffmpeg", "youtube", "video"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]

[package.metadata.bundle]
name = "LoMux"
identifier = "com.zblauser.lomux"
version = "1.1.0"
resources = ["assets/"]
copyright = "Copyright (c) 2025 zblauser"
category = "public.app-category.video"
short_description = "Lightweight media converter"
long_description = """
LoMux converts media files using FFmpeg with a clean GUI.
Download from YouTube, convert between formats, edit metadata.
"""
icon = ["assets/LoMux.icns", "assets/LoMux.png"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "6.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
