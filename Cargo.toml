[package]
name = "lomux"
version = "1.0.2"
edition = "2021"
authors = ["zblauser"]
description = "Advanced media converter with FFmpeg, yt-dlp integration, and Adobe-style presets"
repository = "https://github.com/zblauser/LoMux"
license = "MIT"

[package.metadata.bundle]
name = "lomux"
identifier = "com.zblauser.lomux"
category = "public.app-category.utilities"
icon = ["assets/LoMux.icns", "assets/LoMux.png"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "6.0"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# Debug
[profile.dev]
opt-level = 1
debug = 1

# Release
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# Release Max
[profile.release-max]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

# Release Fast
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
